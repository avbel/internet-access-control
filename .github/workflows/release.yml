name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            archive: internet-access-control-linux-musl-arm64
          - target: armv7-unknown-linux-musleabihf
            archive: internet-access-control-linux-musl-armv7
          - target: mipsel-unknown-linux-musl
            archive: internet-access-control-linux-musl-mipsel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Set package version from tag
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not map to a valid Cargo SemVer version" >&2
            exit 1
          fi

          export RELEASE_VERSION="${version}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{RELEASE_VERSION}"/m' Cargo.toml
          cargo metadata --format-version 1 --no-deps > /dev/null

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail

          package="${{ matrix.archive }}-v${RELEASE_VERSION}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/internet-access-control" "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: internet-access-control-linux-musl-*
          merge-multiple: true

      - name: Attach archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
